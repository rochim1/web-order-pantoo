# Konfigurasi penuh Nginx untuk build Vite/Vue Web Order Pantoo.
# Salin sebagai vhost order.pantoo.id (gantikan konfigurasi vhost lama).
# Jangan sertakan ulang file rewrite aaPanel lama yang mungkin memiliki location /.

server {
    listen 80;
    server_name order.pantoo.id;
    root /www/wwwroot/WEB_ORDER_PANTOO/dist;

    # Tetap izinkan validasi sertifikat Let's Encrypt melalui aaPanel.
    include /www/server/panel/vhost/nginx/well-known/order.pantoo.id.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name order.pantoo.id;
    root /www/wwwroot/WEB_ORDER_PANTOO/dist;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/order.pantoo.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/order.pantoo.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /www/server/panel/vhost/nginx/well-known/order.pantoo.id.conf;

    # File hasil build Vite memiliki nama dengan hash; file yang hilang harus 404,
    # bukan dibalas index.html karena itu akan menyebabkan error MIME JavaScript.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Vue Router menggunakan createWebHistory: URL meja/order harus masuk ke SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan pernah sajikan file tersembunyi, kecuali endpoint sertifikat.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    access_log /www/wwwlogs/order.pantoo.id.log;
    error_log /www/wwwlogs/order.pantoo.id.error.log;
}
